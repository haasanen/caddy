name: docker
on:
  schedule:
    - cron: '30 3 * * *'
  push:
    paths: ['.github/workflows/docker.yml', 'docker/**']
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync upstream caddy release tags into this fork
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/caddyserver/caddy.git
          git fetch --tags --force upstream
          LATEST=$(curl -fsSL https://api.github.com/repos/caddyserver/caddy/releases/latest | jq -r .tag_name)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Core lineage (since 2026-11-06, owner doctrine "always update to
          # upstream version"): master is rebased onto the 2.11.x RELEASE LINE
          # (v2.11.9 base) — upstream master is the v3-dev lineage with NO
          # merge-base with 2.11 tags (8ae69fae is its root; unrelated
          # histories), so tag "merges" are impossible; upgrades = lineage
          # swaps performed deliberately (wiki entities/caddy.md). This step
          # only reports when a newer release is not yet in the core.
          if git merge-base --is-ancestor "$LATEST" HEAD 2>/dev/null; then
            echo "core synced through $LATEST" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "upstream release $LATEST NOT in fork core yet (swap pending; see wiki entities/caddy.md)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check porkbun plugin releases and bump lock
        run: |
          set -euo pipefail
          source docker/version.lock
          P=$(curl -fsSL https://api.github.com/repos/caddy-dns/porkbun/releases/latest | jq -r .tag_name)
          echo "porkbun upstream=$P locked=$PORKBUN_VERSION"
          if [ "$P" != "$PORKBUN_VERSION" ]; then
            printf 'CADDY_VERSION=%s\nPORKBUN_VERSION=%s\nIMAGE_SUFFIX=%s\n' "$CADDY_VERSION" "$P" "${IMAGE_SUFFIX:-}" > docker/version.lock
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docker/version.lock
            git commit -m "docker: bump porkbun to $P"
            git push
          fi
      - name: Build (fork tree is the caddy core source)
        run: |
          set -euo pipefail
          source docker/version.lock
          docker build -f docker/Dockerfile \
            --build-arg CADDY_VERSION="$CADDY_VERSION" \
            --build-arg PORKBUN_VERSION="$PORKBUN_VERSION" \
            -t caddy-fork-local:$CADDY_VERSION .
      - name: Smoke test
        run: |
          set -euo pipefail
          source docker/version.lock
          docker run --rm caddy-fork-local:$CADDY_VERSION caddy version | grep -F "$CADDY_VERSION"
          docker run --rm caddy-fork-local:$CADDY_VERSION caddy list-modules | grep -F "dns.providers.porkbun"
      - name: Push to ghcr
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          set -euo pipefail
          source docker/version.lock
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u USERNAME --password-stdin
          IMG=ghcr.io/haasanen/caddy
          IMAGE_TAG="${CADDY_VERSION}${IMAGE_SUFFIX}"
          docker tag caddy-fork-local:$CADDY_VERSION $IMG:$IMAGE_TAG
          docker tag caddy-fork-local:$CADDY_VERSION $IMG:latest
          docker push $IMG:$IMAGE_TAG
          docker push $IMG:latest
